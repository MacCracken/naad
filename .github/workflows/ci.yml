name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Changelog entry matches VERSION
        # Pre-tag gate. release.yml extracts the release body by awk-ing the
        # `## [<tag>]` section out of CHANGELOG.md and falls back to the literal
        # "No changelog entry for <tag>." when that comes back empty — but that
        # step runs AFTER the tag is pushed, so failing there would leave a
        # published tag with no release and force a delete-and-retag. Catch it
        # on the branch instead, using the SAME extractor release.yml uses.
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BODY=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "CHANGELOG.md has no '## [$VERSION]' section (VERSION=$VERSION)."
            echo "Add one before tagging — release.yml would publish an empty release body."
            exit 1
          fi
          echo "Changelog entry found for $VERSION ($(printf '%s' "$BODY" | wc -c) bytes)"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Symbol-collision gate
        # Cyrius has ONE FLAT NAMESPACE once distlib bundles are concatenated by
        # a consumer. Duplicate top-level `fn`s warn; duplicate top-level `var`s
        # emit NOTHING from cycc or cyrlint — which is how naad's
        # ERR_INVALID_FREQUENCY (-1) shadowed goonj's (-3) for three releases.
        # 2.1.3 renamed the error block to NAAD_ERR_*; this keeps it that way.
        # Regenerates the bundle first so the check runs against current src/.
        run: |
          cyrius distlib
          ./scripts/symbol-collision-check.sh

      - name: Bundle is up to date
        # dist/naad.cyr is a TRACKED artifact consumers link directly. If src/
        # changed without regenerating it, the bundle on main is stale and
        # tests/bundle.tcyr would be exercising last release's code.
        run: |
          if ! git diff --quiet -- dist/; then
            echo "dist/ is stale — run 'cyrius distlib' and commit the result:"
            git --no-pager diff --stat -- dist/
            exit 1
          fi
          echo "dist/ matches src/"

      - name: Test
        # Bare `cyrius test` auto-discovers and runs every tests/**/*.tcyr
        # (recursively since 6.5.11; shallow but still automatic before that) —
        # 38 suites here. This avoids the old `cyrius test src/test.cyr` form,
        # which hard-failed when the stub didn't exist and never exercised the
        # per-module suites. Run one suite by path: `cyrius test tests/<mod>.tcyr`.
        run: cyrius test
